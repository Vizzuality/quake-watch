name: CI lab

on:
  push:
    branches: [ci/speed-lab]

permissions:
  contents: read

jobs:
  pipeline:
    name: ${{ matrix.os }} / ${{ matrix.job }} / ${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        job: [static, typecheck, unit, integration]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: matrix.job == 'static'
        run: pnpm audit --prod --audit-level high && pnpm lint && pnpm format:check
      - if: matrix.job == 'typecheck'
        run: pnpm build && pnpm typecheck
      - if: matrix.job == 'unit'
        run: pnpm test:coverage
      - if: matrix.job == 'integration'
        name: missing apt packages
        run: |
          pkgs=$(pnpm exec playwright install-deps --dry-run chromium 2>/dev/null | grep -oE 'apt-get install -y --no-install-recommends .*' | sed 's/.*--no-install-recommends //')
          for p in $pkgs; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "ok installed" || echo "MISSING $p"; done
      - if: matrix.job == 'integration'
        run: pnpm exec playwright install --only-shell chromium
      - if: matrix.job == 'integration'
        run: pnpm test:integration
